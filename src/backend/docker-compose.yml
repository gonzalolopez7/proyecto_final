services:
  postgres:
    image: postgres:17
    container_name: sgcs_postgres
    environment:
      POSTGRES_USER: ${PG_USER:?}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?}
      POSTGRES_DB: ${DB_NAME:?}
    ports:
      - "5432:5432"
    volumes:
      - sgcs_postgres_data:/var/lib/postgresql/data

volumes:
  sgcs_postgres_data: